<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Purity Lock</title>
<link rel="stylesheet" href="../styles/themes.css" />
<link rel="stylesheet" href="../styles/base.css" />
<style>
  :root{
    --pl-bg:#060B16;
    --pl-glass: rgba(15,25,42,0.55);
    --pl-border: rgba(216,178,74,0.28);
    --pl-border-soft: rgba(233,238,247,0.08);
    --pl-royal:#2D6BFF;
    --pl-electric:#59C7FF;
    --pl-gold:#D8B24A;
    --pl-text:#E9EEF7;
    --pl-text-dim: rgba(233,238,247,0.55);
    --pl-text-faint: rgba(233,238,247,0.34);
    --pl-success:#34D399;
    --pl-warning:#FBBF24;
    --pl-error:#F87171;
    --pl-radius: 20px;
    --pl-radius-sm: 12px;
  }

  * { box-sizing: border-box; }

  body{
    width: 340px;
    margin: 0;
    padding: 16px;
    background:
      radial-gradient(120% 90% at 15% -10%, rgba(45,107,255,0.16) 0%, transparent 55%),
      radial-gradient(90% 70% at 100% 0%, rgba(216,178,74,0.10) 0%, transparent 50%),
      var(--pl-bg);
    color: var(--pl-text);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- Header ---------- */
  .pl-header{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:16px;
  }
  .pl-logo{
    width:34px; height:34px;
    border-radius: 10px;
    display:flex; align-items:center; justify-content:center;
    background: linear-gradient(155deg, rgba(45,107,255,0.22), rgba(216,178,74,0.16));
    border: 1px solid var(--pl-border);
    flex-shrink:0;
  }
  .pl-wordmark{ flex:1; min-width:0; }
  .pl-wordmark h1{
    font-size: 0.95rem;
    font-weight: 800;
    letter-spacing: 0.04em;
    margin: 0;
    color: var(--pl-text);
  }
  .pl-wordmark .pl-tagline{
    font-size: 0.62rem;
    color: var(--pl-gold);
    text-transform: uppercase;
    letter-spacing: 0.12em;
    font-weight: 600;
  }
  .pl-icon-btn{
    width: 32px; height: 32px;
    border-radius: 9px;
    border: 1px solid var(--pl-border-soft);
    background: rgba(255,255,255,0.03);
    color: var(--pl-text-dim);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    transition: all .15s ease;
    flex-shrink:0;
  }
  .pl-icon-btn:hover{
    color: var(--pl-text);
    border-color: var(--pl-border);
    background: rgba(216,178,74,0.08);
  }
  .pl-icon-btn.is-paused{ color: var(--pl-warning); border-color: rgba(251,191,36,0.35); }

  /* ---------- Status ring card ---------- */
  .pl-status-card{
    position: relative;
    background: var(--pl-glass);
    backdrop-filter: blur(20px);
    border-radius: var(--pl-radius);
    border: 1px solid var(--pl-border);
    padding: 22px 16px 18px;
    margin-bottom: 14px;
    text-align:center;
    overflow: hidden;
  }
  .pl-status-card::before{
    content:"";
    position:absolute; inset:-40% -40% auto -40%;
    height: 140%;
    background: radial-gradient(closest-side, rgba(45,107,255,0.18), transparent 70%);
    animation: pl-glow 5s ease-in-out infinite;
    pointer-events:none;
  }
  @keyframes pl-glow{
    0%,100%{ opacity:.55; transform: translateY(0); }
    50%{ opacity:1; transform: translateY(6px); }
  }
  .status-ring{ position: relative; width: 132px; height: 132px; margin: 0 auto 14px; }
  .status-ring svg{ transform: rotate(-90deg); filter: drop-shadow(0 0 10px rgba(45,107,255,0.35)); }
  .status-content{
    position:absolute; top:50%; left:50%;
    transform: translate(-50%,-50%);
    text-align:center;
  }
  .status-value{ font-size: 1.3rem; font-weight: 800; color: var(--pl-electric); font-variant-numeric: tabular-nums; }
  .status-label{ font-size: 0.63rem; color: var(--pl-text-faint); text-transform: uppercase; letter-spacing: 0.14em; margin-top: 2px; }

  .pl-domain-row{
    display:flex; align-items:center; justify-content:center; gap:6px;
    font-size: 0.72rem;
    color: var(--pl-text-dim);
    margin-top: 2px;
  }
  .pl-dot{ width:6px; height:6px; border-radius:50%; background: var(--pl-success); box-shadow: 0 0 8px var(--pl-success); flex-shrink:0; }
  .pl-dot.dot-paused{ background: var(--pl-warning); box-shadow: 0 0 8px var(--pl-warning); }
  .pl-dot.dot-locked{ background: var(--pl-error); box-shadow: 0 0 8px var(--pl-error); }

  /* ---------- Tabs ---------- */
  .pl-tabs{
    position: relative;
    display: grid;
    grid-template-columns: 1fr 1fr;
    background: rgba(255,255,255,0.03);
    border: 1px solid var(--pl-border-soft);
    border-radius: var(--pl-radius-sm);
    padding: 3px;
    margin-bottom: 14px;
  }
  .pl-tab-slider{
    position:absolute; top:3px; bottom:3px; left:3px;
    width: calc(50% - 3px);
    background: linear-gradient(135deg, var(--pl-royal), var(--pl-electric));
    border-radius: 9px;
    transition: transform .25s cubic-bezier(.4,0,.2,1);
    box-shadow: 0 2px 10px rgba(45,107,255,0.4);
  }
  .pl-tabs[data-active="list"] .pl-tab-slider{ transform: translateX(100%); }
  .pl-tab-btn{
    position: relative;
    z-index: 1;
    border: none;
    background: transparent;
    color: var(--pl-text-dim);
    font-size: 0.74rem;
    font-weight: 700;
    letter-spacing: 0.02em;
    padding: 8px 0;
    border-radius: 9px;
    cursor: pointer;
    transition: color .2s ease;
  }
  .pl-tabs[data-active="overview"] .pl-tab-btn[data-tab="overview"],
  .pl-tabs[data-active="list"] .pl-tab-btn[data-tab="list"]{
    color: #06101f;
  }

  .pl-panel{ display:none; }
  .pl-panel.is-active{ display:block; animation: pl-fade .18s ease; }
  @keyframes pl-fade{ from{ opacity:0; transform: translateY(3px);} to{opacity:1; transform:translateY(0);} }

  /* ---------- Overview panel ---------- */
  .mini-stats{
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 12px;
  }
  .mini-stat-card{
    position: relative;
    padding: 12px 10px;
    text-align: center;
    background: var(--pl-glass);
    backdrop-filter: blur(20px);
    border-radius: var(--pl-radius-sm);
    border: 1px solid var(--pl-border);
  }
  .mini-stat-card::after{
    content:"";
    position:absolute; top:0; left:12px; right:12px; height:1px;
    background: linear-gradient(90deg, transparent, var(--pl-gold), transparent);
    opacity: .6;
  }
  .mini-stat-val{ display:block; font-weight: 800; font-size: 1.2rem; color: var(--pl-text); font-variant-numeric: tabular-nums; }
  .mini-stat-lab{ font-size: 0.6rem; color: var(--pl-text-faint); text-transform: uppercase; letter-spacing: 0.1em; }
  .mini-stat-val.accent-gold{ color: var(--pl-gold); }
  .mini-stat-val.accent-error{ color: var(--pl-error); }

  .pl-total-row{
    display:flex; align-items:center; justify-content:space-between;
    background: rgba(216,178,74,0.06);
    border: 1px solid var(--pl-border);
    border-radius: var(--pl-radius-sm);
    padding: 10px 12px;
    margin-bottom: 4px;
  }
  .pl-total-row .pl-total-lab{ font-size: 0.7rem; color: var(--pl-text-dim); }
  .pl-total-row .pl-total-val{ font-size: 0.95rem; font-weight: 800; color: var(--pl-gold); }

  /* ---------- Block list panel ---------- */
  .pl-current-site{
    display:flex; align-items:center; gap:8px;
    background: rgba(255,255,255,0.03);
    border: 1px solid var(--pl-border-soft);
    border-radius: var(--pl-radius-sm);
    padding: 10px 12px;
    margin-bottom: 10px;
  }
  .pl-favicon{ width:16px; height:16px; border-radius:4px; background: rgba(255,255,255,0.08); flex-shrink:0; }
  .pl-current-site span{
    font-size: 0.76rem;
    color: var(--pl-text);
    font-weight: 600;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .pl-field-lab{
    font-size: 0.62rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--pl-text-faint);
    margin: 0 0 5px 2px;
  }
  .pl-select, .pl-input{
    width: 100%;
    background: rgba(255,255,255,0.03);
    border: 1px solid var(--pl-border-soft);
    color: var(--pl-text);
    border-radius: var(--pl-radius-sm);
    padding: 9px 10px;
    font-size: 0.78rem;
    margin-bottom: 10px;
    outline: none;
    transition: border-color .15s ease;
    font-family: inherit;
  }
  .pl-select:focus, .pl-input:focus{ border-color: var(--pl-gold); }
  .pl-select{ cursor:pointer; }

  .pl-add-btn{
    width:100%;
    border:none;
    border-radius: var(--pl-radius-sm);
    padding: 10px 0;
    font-weight: 800;
    font-size: 0.8rem;
    letter-spacing: 0.02em;
    color: #06101f;
    background: linear-gradient(135deg, var(--pl-gold), #EFD48F);
    box-shadow: 0 4px 16px rgba(216,178,74,0.28);
    cursor: pointer;
    transition: transform .12s ease, box-shadow .12s ease;
    margin-bottom: 12px;
  }
  .pl-add-btn:hover{ transform: translateY(-1px); box-shadow: 0 6px 20px rgba(216,178,74,0.38); }
  .pl-add-btn:active{ transform: translateY(0); }
  .pl-add-btn.is-added{ background: linear-gradient(135deg, var(--pl-success), #6EE7B7); box-shadow: 0 4px 16px rgba(52,211,153,0.3); }

  .pl-badge-row{
    display:flex; align-items:center; justify-content:space-between;
    padding-top: 8px;
    border-top: 1px solid var(--pl-border-soft);
  }
  .pl-badge-row .pl-field-lab{ margin:0; }
  .pl-badge-row select{
    background: rgba(255,255,255,0.03);
    border: 1px solid var(--pl-border-soft);
    color: var(--pl-text-dim);
    border-radius: 8px;
    padding: 5px 8px;
    font-size: 0.7rem;
    font-family: inherit;
  }

  /* ---------- Footer ---------- */
  .pl-footer{ display:flex; gap:8px; margin-top: 14px; }
  .pl-btn-primary{
    flex:1;
    border:none;
    border-radius: var(--pl-radius-sm);
    padding: 12px 0;
    font-weight: 800;
    font-size: 0.82rem;
    color: #ffffff;
    background: linear-gradient(135deg, var(--pl-royal), var(--pl-electric));
    box-shadow: 0 4px 18px rgba(45,107,255,0.35);
    cursor: pointer;
    transition: transform .12s ease, box-shadow .12s ease;
  }
  .pl-btn-primary:hover{ transform: translateY(-1px); box-shadow: 0 6px 22px rgba(45,107,255,0.45); }
  .pl-btn-secondary{
    width: 44px;
    border-radius: var(--pl-radius-sm);
    border: 1px solid var(--pl-border);
    background: rgba(216,178,74,0.06);
    color: var(--pl-gold);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    transition: all .15s ease;
  }
  .pl-btn-secondary:hover{ background: rgba(216,178,74,0.14); }
</style>
</head>
<body data-theme="dark">

  <div class="pl-header">
    <div class="pl-logo">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
        <path d="M12 2L4 5.5V11c0 5.2 3.4 9.8 8 11 4.6-1.2 8-5.8 8-11V5.5L12 2z" stroke="#D8B24A" stroke-width="1.6" fill="rgba(45,107,255,0.18)"/>
        <circle cx="12" cy="11" r="2.4" stroke="#59C7FF" stroke-width="1.4" fill="none"/>
        <path d="M12 13v2.4" stroke="#59C7FF" stroke-width="1.4" stroke-linecap="round"/>
      </svg>
    </div>
    <div class="pl-wordmark">
      <h1>PURITY LOCK</h1>
      <div class="pl-tagline" id="header-tagline">Shielded</div>
    </div>
    <button id="toggle-pause" class="pl-icon-btn" title="Pause protection">
      <svg id="pause-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="6" y="4" width="4" height="16" rx="1"></rect>
        <rect x="14" y="4" width="4" height="16" rx="1"></rect>
      </svg>
    </button>
  </div>

  <div class="pl-status-card">
    <div class="status-ring">
      <svg width="132" height="132">
        <circle cx="66" cy="66" r="60" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="6" />
        <circle id="status-fg" cx="66" cy="66" r="60" fill="none" stroke="var(--pl-electric)" stroke-width="6" stroke-dasharray="377" stroke-dashoffset="0" stroke-linecap="round" />
      </svg>
      <div class="status-content">
        <div id="status-text" class="status-value">Active</div>
        <div id="status-subtext" class="status-label">Protected</div>
      </div>
    </div>
    <div class="pl-domain-row">
      <span id="status-dot" class="pl-dot"></span>
      <span id="status-detail">All filters running</span>
    </div>
  </div>

  <div class="pl-tabs" id="pl-tabs" data-active="overview">
    <div class="pl-tab-slider"></div>
    <button class="pl-tab-btn" data-tab="overview">Overview</button>
    <button class="pl-tab-btn" data-tab="list">Block List</button>
  </div>

  <div id="panel-overview" class="pl-panel is-active">
    <div class="mini-stats">
      <div class="mini-stat-card">
        <span id="streak-val" class="mini-stat-val accent-gold">0</span>
        <span class="mini-stat-lab">Day Streak</span>
      </div>
      <div class="mini-stat-card">
        <span id="today-val" class="mini-stat-val accent-error">0</span>
        <span class="mini-stat-lab">Blocked Today</span>
      </div>
    </div>
    <div class="pl-total-row">
      <span class="pl-total-lab">Total blocked all-time</span>
      <span id="total-val" class="pl-total-val">0</span>
    </div>
  </div>

  <div id="panel-list" class="pl-panel">
    <div class="pl-current-site">
      <span class="pl-favicon" id="current-favicon"></span>
      <span id="current-domain">Loading site…</span>
    </div>

    <p class="pl-field-lab">Add this site to</p>
    <select id="list-select" class="pl-select">
      <option value="lustful">Lustful Websites</option>
      <option value="social">Social Media</option>
      <option value="news">News &amp; Doomscroll</option>
      <option value="custom">Custom List…</option>
    </select>

    <input id="site-input" class="pl-input" type="text" placeholder="example.com" />

    <button id="add-site-btn" class="pl-add-btn">+ Add to Block List</button>

    <div class="pl-badge-row">
      <span class="pl-field-lab">Icon badge shows</span>
      <select id="badge-select">
        <option value="none">Nothing</option>
        <option value="today">Blocked today</option>
        <option value="streak">Streak</option>
      </select>
    </div>
  </div>

  <div class="pl-footer">
    <button id="open-dashboard" class="pl-btn-primary">Dashboard</button>
    <button id="open-settings" class="pl-btn-secondary">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
    </button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
